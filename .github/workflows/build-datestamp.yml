name: Build datestamp exe

on:
  push:
    tags:
      - 'datestamp-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install pyinstaller tkinterdnd2

      - name: Build exe
        run: pyinstaller --onefile --windowed --name datestamp datestamp.pyw

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: datestamp-exe
          path: dist/datestamp.exe

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/datestamp.exe
