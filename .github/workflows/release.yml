name: Build utility executables

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install pyinstaller -r requirements.txt

      - name: Build executables
        shell: pwsh
        run: |
          Get-ChildItem -Filter *.pyw | ForEach-Object {
            python -m PyInstaller --onefile --windowed --name $_.BaseName $_.FullName
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: utility-executables
          path: dist/*.exe

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
